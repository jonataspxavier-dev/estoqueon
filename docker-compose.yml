services:
  mysql:
    image: mysql:8.4
    container_name: estoqueon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estoqueon
      MYSQL_USER: estoqueon
      MYSQL_PASSWORD: estoqueon
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: estoqueon-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://estoqueon:estoqueon@mysql:3306/estoqueon
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080
      SEED_ON_START: "true"
    ports:
      - "3000:3000"

  web:
    build: ./web
    container_name: estoqueon-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql_data:
